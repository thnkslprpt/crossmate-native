name: iOS compile check

on:
  workflow_dispatch:
  pull_request:

jobs:
  ios-no-codesign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: ./scripts/bootstrap.sh
      - run: flutter build ios --debug --no-codesign
